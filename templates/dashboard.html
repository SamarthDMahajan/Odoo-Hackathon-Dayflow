<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow HRMS - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-purple-700 p-4 text-white flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold">Dayflow HRMS Dashboard</h1>
        <div>
            <span class="mr-4 font-semibold">Welcome, {{ name }} ({{ role }})</span>
            <a href="/logout" class="bg-red-500 px-4 py-2 rounded hover:bg-red-600 transition font-bold">Logout</a>
        </div>
    </nav>
    <div class="container mx-auto mt-8 p-4">
        <div class="bg-white p-6 rounded-lg shadow-md mb-6 w-full max-w-2xl mx-auto">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Daily Attendance</h2>
            <form action="/mark_attendance" method="POST" class="flex gap-4">
                <button type="submit" name="action" value="check_in" class="w-1/2 bg-green-500 text-white px-6 py-3 rounded-lg font-bold hover:bg-green-600">Check In</button>
                <button type="submit" name="action" value="check_out" class="w-1/2 bg-yellow-500 text-white px-6 py-3 rounded-lg font-bold hover:bg-yellow-600">Check Out</button>
            </form>
        </div>
    </div>
</body>
</html>
