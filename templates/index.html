<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow HRMS - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold text-center text-purple-700 mb-6">Dayflow HRMS</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 rounded-lg px-3 py-2 text-sm {% if category == 'success' %}bg-green-100 text-green-800{% else %}bg-red-100 text-red-800{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                <input type="email" name="email" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600" placeholder="Enter your email" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" name="password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600" placeholder="••••••••" required>
            </div>
            <button type="submit" class="w-full bg-purple-700 text-white font-bold py-2 px-4 rounded hover:bg-purple-800 transition duration-300">
                Sign In
            </button>
        </form>

        <!-- Demo Quick-Login Helper for Evaluators -->
        <div class="mt-4 p-3 bg-purple-50 border border-purple-200 rounded-lg text-center">
            <p class="text-xs font-bold text-purple-800 mb-2">🚀 Evaluator Shortcut:</p>
            <button type="button" onclick="fillDemoCredentials()" class="text-xs bg-purple-700 text-white px-3 py-1 rounded hover:bg-purple-800 transition font-semibold">
                Auto-fill Admin Demo Account
            </button>
        </div>

        <script>
        function fillDemoCredentials() {
            // Automatically fill test account email and password
            document.querySelector('input[name="email"]').value = "test@test.com";
            document.querySelector('input[name="password"]').value = "123";
        }
        </script>

        <p class="mt-4 text-center text-sm text-gray-600">
            New here?
            <a href="/register" class="font-bold text-purple-700 hover:text-purple-900">Create an account</a>
        </p>
    </div>
</body>
</html>
