<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow HRMS - My Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-purple-700 p-4 text-white flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold">Dayflow HRMS - Employee Profile</h1>
        <div>
            <a href="/dashboard" class="bg-indigo-500 px-4 py-2 rounded hover:bg-indigo-600 transition font-bold mr-3">Back to Dashboard</a>
            <a href="/logout" class="bg-red-500 px-4 py-2 rounded hover:bg-red-600 transition font-bold">Logout</a>
        </div>
    </nav>

    <div class="container mx-auto mt-8 p-4 max-w-2xl">
        <div class="bg-white p-8 rounded-lg shadow-md border-t-4 border-purple-700">
            <div class="flex items-center space-x-6 mb-6">
                <div class="bg-purple-600 text-white w-20 h-20 rounded-full flex items-center justify-center text-3xl font-bold shadow">
                    {{ user.name[0] }}
                </div>
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">{{ user.name }}</h2>
                    <p class="text-gray-500">Employee ID: <span class="font-mono font-semibold">{{ user.emp_id }}</span></p>
                    <span class="px-3 py-1 rounded text-xs font-bold {% if user.role == 'Admin / HR' %}bg-purple-200 text-purple-800{% else %}bg-blue-200 text-blue-800{% endif %}">
                        {{ user.role }}
                    </span>
                </div>
            </div>

            <div class="border-t pt-4 space-y-3">
                <div class="flex justify-between">
                    <span class="font-semibold text-gray-600">Email Address:</span>
                    <span class="text-gray-800">{{ user.email }}</span>
                </div>
                <div class="flex justify-between">
                    <span class="font-semibold text-gray-600">Total Verified Attendance Days:</span>
                    <span class="text-green-600 font-bold">{{ days_present }} Days</span>
                </div>
                <div class="flex justify-between">
                    <span class="font-semibold text-gray-600">Total Leave Applications:</span>
                    <span class="text-indigo-600 font-bold">{{ total_leaves }} Requests</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
